version: '3.8'

services:
  trading-terminal:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      ANTHROPIC_KEY: ${ANTHROPIC_KEY}
      ROBINHOOD_RPC: https://robin.rpc.robinhood.com
      PORT: 3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
